<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>和璟AI</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2/src/md5.min.js"></script>
    <style>
        /* =========================================================
           HOW TO ADD A NEW PAGE:
           1. Add a route object in `routes` array (e.g., { path: '/newpage', component: NewPage }).
           2. Create a Vue component (e.g., const NewPage = { template: '...' }).
           3. If it needs a tab, add to `tabs` array in App layout and ensure it's rendered.
              Note: Sub-pages (non-tab) should have `meta: { hideTab: true }`.
           ========================================================= */

        /* ==================== STYLE 19: CYBERPUNK ==================== */
        :root {
            /* Cyberpunk Color Palette */
            --bg-dark: #0a0e17;
            --bg-panel: #131a26;
            --bg-card: #1a2332;
            --text-main: #e2e8f0;
            --text-muted: #8b9bb4;
            --accent-neon-orange: #ff6b00;
            --accent-neon-cyan: #00f3ff;
            --accent-neon-pink: #ff00ff;
            --accent-neon-green: #39ff14;
            --border-glow: rgba(0, 243, 255, 0.3);
            
            /* Spacing & Sizing */
            --sp-xs: 4px;
            --sp-sm: 8px;
            --sp-md: 16px;
            --sp-lg: 24px;
            --sp-xl: 32px;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 20px;
            
            /* Shadows & Glows */
            --glow-orange: 0 0 10px rgba(255, 107, 0, 0.5), 0 0 20px rgba(255, 107, 0, 0.2);
            --glow-cyan: 0 0 10px rgba(0, 243, 255, 0.5), 0 0 20px rgba(0, 243, 255, 0.2);
            --glow-box-cyan: inset 0 0 15px rgba(0, 243, 255, 0.1), 0 0 15px rgba(0, 243, 255, 0.1);
            --glow-box-orange: inset 0 0 15px rgba(255, 107, 0, 0.1), 0 0 15px rgba(255, 107, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.5;
            overflow: hidden; /* Prevent body scroll, use app container */
            height: 100vh;
            width: 100vw;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 4px;
        }

        /* ==================== LAYOUT & APP CONTAINER ==================== */
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 107, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(0, 243, 255, 0.05) 0%, transparent 40%);
        }

        .page-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: var(--sp-md);
            padding-top: calc(var(--sp-md) + env(safe-area-inset-top));
            padding-bottom: 80px; /* Space for tab bar */
            position: relative;
            z-index: 1;
        }

        .page-container.no-tab {
            padding-bottom: var(--sp-md);
        }

        /* ==================== TRANSITION ==================== */
        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .fade-enter-from {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-leave-to {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* ==================== COMMON UI COMPONENTS ==================== */
        .cyber-panel {
            background: var(--bg-panel);
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: var(--radius-md);
            box-shadow: var(--glow-box-cyan);
            padding: var(--sp-md);
            margin-bottom: var(--sp-md);
            position: relative;
            overflow: hidden;
        }

        .cyber-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-neon-cyan), transparent);
            opacity: 0.5;
        }

        .neon-text-orange { color: var(--accent-neon-orange); text-shadow: var(--glow-orange); }
        .neon-text-cyan { color: var(--accent-neon-cyan); text-shadow: var(--glow-cyan); }
        
        /* Buttons */
        .cyber-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent-neon-cyan);
            color: var(--accent-neon-cyan);
            padding: var(--sp-sm) var(--sp-md);
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .cyber-btn:active {
            background: rgba(0, 243, 255, 0.1);
            transform: scale(0.98);
        }
        .cyber-btn.orange {
            border-color: var(--accent-neon-orange);
            color: var(--accent-neon-orange);
            box-shadow: 0 0 8px rgba(255, 107, 0, 0.2);
        }
        .cyber-btn.orange:active {
            background: rgba(255, 107, 0, 0.1);
        }
        .cyber-btn:disabled {
            opacity: 0.3;
            border-color: var(--text-muted);
            color: var(--text-muted);
            box-shadow: none;
        }

        /* Form Inputs */
        .cyber-input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0, 243, 255, 0.2);
            color: var(--text-main);
            padding: 12px var(--sp-md);
            border-radius: var(--radius-sm);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            min-height: 44px;
        }
        .cyber-input:focus {
            border-color: var(--accent-neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
        .cyber-label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: var(--sp-xs);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==================== TAB BAR ==================== */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            z-index: 100;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
            min-height: 56px;
        }

        .tab-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: currentColor;
            transition: all 0.3s;
        }

        .tab-item.active {
            color: var(--accent-neon-orange);
            text-shadow: 0 0 8px rgba(255, 107, 0, 0.4);
        }

        .tab-item.active svg {
            filter: drop-shadow(0 0 5px rgba(255, 107, 0, 0.6));
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 2px;
            background: var(--accent-neon-orange);
            box-shadow: 0 0 10px var(--accent-neon-orange);
        }

        /* ==================== HOME SPECIFIC ==================== */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: var(--sp-xl);
            text-align: center;
            padding-top: var(--sp-md);
        }
        .brand-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--accent-neon-orange), var(--accent-neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: var(--sp-xs);
            filter: drop-shadow(0 0 10px rgba(255, 107, 0, 0.3));
        }
        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Quick Actions Grid */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--sp-sm);
            margin-bottom: var(--sp-lg);
        }
        .action-card {
            background: var(--bg-panel);
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--sp-sm);
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s;
            min-height: 80px;
            position: relative;
            overflow: hidden;
        }
        .action-card:active {
            transform: scale(0.95);
            background: var(--bg-card);
            border-color: var(--accent-neon-orange);
        }
        .action-card svg {
            width: 24px;
            height: 24px;
            margin-bottom: var(--sp-xs);
            fill: var(--accent-neon-cyan);
            filter: drop-shadow(0 0 5px rgba(0, 243, 255, 0.4));
        }
        .action-card span {
            font-size: 10px;
            text-align: center;
            line-height: 1.2;
            font-weight: 600;
        }

        /* Stock List */
        .stock-list-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            padding: 0 var(--sp-sm) var(--sp-xs);
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: var(--sp-sm);
        }
        .stock-list-header > div:last-child {
            text-align: right;
        }

        .stock-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            align-items: center;
            padding: 12px var(--sp-sm);
            background: var(--bg-panel);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            text-decoration: none;
            color: var(--text-main);
            transition: background 0.2s;
        }
        .stock-item:active {
            background: var(--bg-card);
        }
        .stock-item:last-child {
            border-bottom: none;
            border-bottom-left-radius: var(--radius-md);
            border-bottom-right-radius: var(--radius-md);
        }
        .stock-item:first-child {
            border-top-left-radius: var(--radius-md);
            border-top-right-radius: var(--radius-md);
        }
        
        .stock-symbol {
            font-weight: 700;
            font-size: 14px;
        }
        .stock-name {
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }
        .stock-price {
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }
        .stock-change {
            text-align: right;
            font-weight: 700;
            font-size: 13px;
        }
        .stock-change.up {
            color: var(--accent-neon-orange);
            text-shadow: 0 0 5px rgba(255, 107, 0, 0.4);
        }
        .stock-change.down {
            color: var(--accent-neon-cyan);
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.4);
        }

        /* ==================== LOADING ==================== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 243, 255, 0.1);
            border-top-color: var(--accent-neon-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: var(--sp-md);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================== SUB PAGES (Detail, etc) ==================== */
        .page-header {
            display: flex;
            align-items: center;
            margin-bottom: var(--sp-lg);
            padding-top: var(--sp-sm);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--accent-neon-cyan);
            font-size: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: var(--sp-xs);
            margin-right: var(--sp-sm);
            min-width: 44px;
            min-height: 44px;
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-right: 4px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .chart-container {
            width: 100%;
            height: 200px;
            margin-top: var(--sp-md);
            position: relative;
        }
        .chart-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Toolbox Grid */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--sp-md);
        }
        .tool-card {
            background: var(--bg-panel);
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: var(--radius-md);
            padding: var(--sp-md);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s;
            box-shadow: var(--glow-box-cyan);
        }
        .tool-card:active {
            transform: scale(0.97);
            background: var(--bg-card);
        }
        .tool-card h3 {
            font-size: 14px;
            margin-bottom: var(--sp-xs);
            color: var(--accent-neon-cyan);
        }
        .tool-card p {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Settings List */
        .settings-group {
            background: var(--bg-panel);
            border-radius: var(--radius-md);
            border: 1px solid rgba(0, 243, 255, 0.15);
            overflow: hidden;
            margin-bottom: var(--sp-lg);
            box-shadow: var(--glow-box-cyan);
        }
        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--sp-md);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-decoration: none;
            color: var(--text-main);
            transition: background 0.2s;
            min-height: 56px;
        }
        .settings-item:active {
            background: var(--bg-card);
        }
        .settings-item:last-child {
            border-bottom: none;
        }
        .settings-item-left {
            display: flex;
            align-items: center;
            gap: var(--sp-sm);
        }
        .settings-item-left svg {
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
        }
        .settings-item-left span {
            font-size: 14px;
        }
        .settings-item-arrow {
            color: var(--text-muted);
            font-size: 18px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 243, 255, 0.9);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show {
            opacity: 1;
        }

        /* Utility */
        .text-center { text-align: center; }
        .mt-md { margin-top: var(--sp-md); }
        .mb-md { margin-bottom: var(--sp-md); }
        .flex-row { display: flex; gap: var(--sp-sm); }
        .flex-1 { flex: 1; }
        
        /* Article / Terms Content */
        .content-box {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
        }
        .content-box h4 {
            color: var(--accent-neon-cyan);
            margin: var(--sp-md) 0 var(--sp-sm);
            font-size: 16px;
        }
        .content-box p {
            margin-bottom: var(--sp-sm);
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Loading State -->
        <div v-if="isLoading" class="loading-screen">
            <div class="spinner"></div>
            <div style="color: var(--accent-neon-cyan); font-family: monospace; font-size: 12px;">INITIALIZING...</div>
        </div>
        
        <!-- Main App Layout -->
        <template v-else>
            <router-view v-slot="{ Component }">
                <transition name="fade" mode="out-in">
                    <component :is="Component" :key="$route.path" />
                </transition>
            </router-view>

            <!-- Tab Bar -->
            <div class="tab-bar" v-if="!$route.meta.hideTab">
                <router-link to="/home" class="tab-item" active-class="active">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span>Home</span>
                </router-link>
                <router-link to="/toolbox" class="tab-item" active-class="active">
                    <svg viewBox="0 0 24 24"><path d="M22 9V7h-2V5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2v-2h-2V9h2zm-4 10H4V5h14v14zM6 13h5v4H6zm6-6h4v3h-4zm0 5h4v5h-4zm-6-5h5v3H6z"/></svg>
                    <span>Toolbox</span>
                </router-link>
                <router-link to="/settings" class="tab-item" active-class="active">
                    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                    <span>Settings</span>
                </router-link>
            </div>
            
            <!-- Global Toast -->
            <div class="toast" :class="{ show: toastMessage }">{{ toastMessage }}</div>
        </template>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, onUnmounted, watch, reactive } = Vue;
        const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

        // ==================== DATA ====================
        const STOCKS_DATA = [
            { symbol: 'AAPL', name: 'Apple Inc.', price: 175.50, change: 1.25 },
            { symbol: 'MSFT', name: 'Microsoft Corp.', price: 420.30, change: 0.85 },
            { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 155.80, change: -0.45 },
            { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 180.20, change: 2.10 },
            { symbol: 'TSLA', name: 'Tesla Inc.', price: 240.50, change: -3.15 },
            { symbol: 'META', name: 'Meta Platforms Inc.', price: 510.10, change: 1.80 },
            { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 880.40, change: 4.50 },
            { symbol: 'BRK.B', name: 'Berkshire Hathaway', price: 405.60, change: 0.15 },
            { symbol: 'JPM', name: 'JPMorgan Chase & Co.', price: 195.30, change: -0.80 },
            { symbol: 'V', name: 'Visa Inc.', price: 280.15, change: 0.55 },
            { symbol: 'UNH', name: 'UnitedHealth Group', price: 520.70, change: -1.20 },
            { symbol: 'JNJ', name: 'Johnson & Johnson', price: 155.40, change: 0.30 },
            { symbol: 'WMT', name: 'Walmart Inc.', price: 60.25, change: 0.90 },
            { symbol: 'PG', name: 'Procter & Gamble', price: 160.80, change: -0.25 },
            { symbol: 'MA', name: 'Mastercard Inc.', price: 460.50, change: 1.10 },
            { symbol: 'HD', name: 'Home Depot Inc.', price: 375.20, change: -0.60 },

                });
                
                const strengthLabel = computed(() => {
                    const s = strengthPercent.value;
                    if (s === 0) return 'None';
                    if (s < 40) return 'Weak';
                    if (s < 70) return 'Medium';
                    return 'Strong';
                });
                
                const strengthColor = computed(() => {
                    const s = strengthPercent.value;
                    if (s < 40) return '#ff00ff'; // Pink/Red
                    if (s < 70) return 'var(--accent-neon-orange)';
                    return 'var(--accent-neon-green)';
                });
                
                return { password, md5Hash, strengthPercent, strengthLabel, strengthColor };
            }
        };

        // --- Settings Component ---
        const Settings = {
            template: `
                <div class="page-container">
                    <div class="page-header">
                        <div class="page-title" style="font-size: 24px; background: linear-gradient(90deg, var(--accent-neon-orange), var(--accent-neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Settings</div>
                    </div>
                    
                    <div class="settings-group">
                        <router-link to="/settings/privacy" class="settings-item">
                            <div class="settings-item-left">
                                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                                <span>Privacy Policy</span>
                            </div>
                            <div class="settings-item-arrow">›</div>
                        </router-link>
                        <router-link to="/settings/terms" class="settings-item">
                            <div class="settings-item-left">
                                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                <span>Terms of Service</span>
                            </div>
                            <div class="settings-item-arrow">›</div>
                        </router-link>
                        <a href="mailto:com.cukpcalculatorconvertor.app@gmail.com" class="settings-item">
                            <div class="settings-item-left">
                                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                                <span>Contact Us</span>
                            </div>
                            <div class="settings-item-arrow">›</div>
                        </a>
                    </div>
                    
                    <div class="settings-group">
                        <div class="settings-item">
                            <div class="settings-item-left">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                                <span>Version</span>
                            </div>
                            <span style="color: var(--text-muted); font-size: 12px;">1.0.0</span>
                        </div>
                    </div>
                </div>
            `
        };

        // --- Generic Content Page (Privacy, Terms) ---
        const ContentPage = {
            template: `
                <div class="page-container no-tab">
                    <div class="page-header">
                        <button class="back-btn" @click="$router.back()">
                            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                            Back
                        </button>
                        <div class="page-title">{{ title }}</div>
                    </div>
                    <div class="cyber-panel content-box">
                        <div v-html="content"></div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const title = computed(() => route.path.includes('privacy') ? 'Privacy Policy' : 'Terms of Service');
                
                const content = computed(() => {
                    if (route.path.includes('privacy')) {
                        return `
                            <h4>Data Collection</h4>
                            <p>We collect minimal information necessary to provide our services. Your financial data entered into local tools is never transmitted to our servers.</p>
                            <h4>Device Information</h4>
                            <p>We may generate an anonymous device fingerprint to ensure secure access and prevent fraud. This fingerprint does not personally identify you.</p>
                            <h4>Third-Party Services</h4>
                            <p>We do not sell your personal information to third parties.</p>
                        `;
                    } else {
                        return `
                            <h4>Acceptance of Terms</h4>
                            <p>By accessing and using this application, you accept and agree to be bound by the terms and provision of this agreement.</p>
                            <h4>Use License</h4>
                            <p>Permission is granted to temporarily use this application for personal, non-commercial transitory viewing only.</p>
                            <h4>Disclaimer</h4>
                            <p>The materials on this application are provided on an 'as is' basis. We make no warranties, expressed or implied, and hereby disclaim and negate all other warranties.</p>
                        `;
                    }
                });
                
                return { title, content };
            }
        };

        // ==================== ROUTER ====================
        const routes = [
            { path: '/', redirect: '/home' }, // Loading handled separately
            { path: '/home', component: Home },
            { path: '/toolbox', component: Toolbox },
            { path: '/settings', component: Settings },
            
            // Sub-pages
            { path: '/stock/:symbol', component: StockDetail, meta: { hideTab: true } },
            { path: '/gainers', component: StockListPage, meta: { hideTab: true } },
            { path: '/losers', component: StockListPage, meta: { hideTab: true } },
            { path: '/active', component: StockListPage, meta: { hideTab: true } },
            { path: '/potential', component: StockListPage, meta: { hideTab: true } },
            { path: '/picks', component: StockListPage, meta: { hideTab: true } },
            { path: '/notrec', component: StockListPage, meta: { hideTab: true } },
            { path: '/watchlist', component: StockListPage, meta: { hideTab: true } },
            { path: '/guide', component: Guide, meta: { hideTab: true } },
            
            // Tools
            { path: '/tool/dca', component: DcaTool, meta: { hideTab: true } },
            { path: '/tool/loan', component: LoanTool, meta: { hideTab: true } },
            { path: '/tool/password', component: PasswordTool, meta: { hideTab: true } },
            
            // Settings
            { path: '/settings/privacy', component: ContentPage, meta: { hideTab: true } },
            { path: '/settings/terms', component: ContentPage, meta: { hideTab: true } },
            
            // Catch-all
            { path: '/:pathMatch(.*)*', redirect: '/home' }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // ==================== MAIN APP ====================
        const App = {
            template: `
                <div id="app-root">
                    <!-- Loading State -->
                    <Loading v-if="isLoading" />
                    
                    <!-- Main App Layout -->
                    <template v-else>
                        <router-view v-slot="{ Component }">
                            <transition name="fade" mode="out-in">
                                <component :is="Component" :key="$route.path" />
                            </transition>
                        </router-view>

                        <!-- Tab Bar -->
                        <div class="tab-bar" v-if="!$route.meta.hideTab">
                            <router-link to="/home" class="tab-item" active-class="active">
                                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                                <span>Home</span>
                            </router-link>
                            <router-link to="/toolbox" class="tab-item" active-class="active">
                                <svg viewBox="0 0 24 24"><path d="M22 9V7h-2V5c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2v-2h-2V9h2zm-4 10H4V5h14v14zM6 13h5v4H6zm6-6h4v3h-4zm0 5h4v5h-4zm-6-5h5v3H6z"/></svg>
                                <span>Toolbox</span>
                            </router-link>
                            <router-link to="/settings" class="tab-item" active-class="active">
                                <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                                <span>Settings</span>
                            </router-link>
                        </div>
                    </template>
                </div>
            `,
            setup() {
                const isLoading = ref(true);
                const toastMessage = ref('');

                const showToast = (msg) => {
                    toastMessage.value = msg;
                    setTimeout(() => {
                        toastMessage.value = '';
                    }, 2000);
                };

                // Provide toast to all children
                Vue.provide('toast', showToast);

                // Simulate initial loading delay / privacy check
                onMounted(() => {
                    // The Loading component handles the actual logic and router redirection.
                    // We just need to hide the loading screen after a short delay to allow the router to settle.
                    setTimeout(() => {
                        isLoading.value = false;
                    }, 800);
                });

                return { isLoading, toastMessage };
            }
        };

        // Add Loading as a component
        App.components = { Loading };

        const app = createApp(App);
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
