<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>和璟AI</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>

<style>
/* ==========================================================================
   THEME: Neo-neumorphism (Style #7) — soft extruded surfaces, same-tone shadows
   ========================================================================== */
:root{
  --bg:#e8ecf2;
  --surface:#e8ecf2;
  --surface-2:#eef2f8;
  --text:#1f2733;
  --text-2:#5a6678;
  --text-3:#8794a8;
  --accent:#2f6bff;
  --accent-2:#4d86ff;
  --up:#e0532f;
  --down:#1f8f6a;
  --danger:#d64545;
  --radius:18px;
  --radius-sm:12px;
  --gap:14px;
  --pad:16px;
  --sh-out: 6px 6px 14px #c9d2e0, -6px -6px 14px #ffffff;
  --sh-in: inset 4px 4px 10px #cfd7e4, inset -4px -4px 10px #ffffff;
  --sh-soft: 3px 3px 8px #cdd5e2, -3px -3px 8px #ffffff;
  --tab-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{height:100%}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
ul,li{margin:0;padding:0;list-style:none}

/* App shell */
.app-shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.page-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t) + 14px) var(--pad) calc(var(--tab-h) + var(--safe-b) + 22px);}
.page-scroll.no-tab{padding-bottom:calc(var(--safe-b) + 28px)}

/* Transitions */
.fade-slide-enter-active,.fade-slide-leave-active{transition:opacity .22s ease, transform .22s ease}
.fade-slide-enter-from{opacity:0;transform:translateY(10px)}
.fade-slide-leave-to{opacity:0;transform:translateY(-6px)}

/* Cards / surfaces */
.card{
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--sh-out);
  padding:16px;
  margin-bottom:var(--gap);
}
.card-in{background:var(--surface);border-radius:var(--radius-sm);box-shadow:var(--sh-in)}

/* Typography helpers */
.h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:0 0 4px}
.h2{font-size:17px;font-weight:700;margin:0 0 10px}
.sub{font-size:13px;color:var(--text-2);line-height:1.55;margin:0}
.muted{color:var(--text-3);font-size:12px}

/* ============ Loading screen ============ */
.loading-screen{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;
  background:var(--bg);z-index:900;
}
.loader-logo{
  width:88px;height:88px;border-radius:26px;display:grid;place-items:center;
  background:var(--surface);box-shadow:var(--sh-out);
}
.loader-logo svg{width:46px;height:46px}
.spinner{
  width:30px;height:30px;border-radius:50%;
  background:var(--bg);
  box-shadow:var(--sh-out);
  position:relative;display:grid;place-items:center;
}
.spinner::after{
  content:"";width:14px;height:14px;border-radius:50%;
  border:3px solid var(--accent);border-right-color:transparent;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text-2);letter-spacing:.4px}

/* ============ Header brand ============ */
.brand-hero{
  background:linear-gradient(145deg,#eef2f8,#e2e8f1);
  border-radius:22px;padding:22px 18px;margin-bottom:18px;
  box-shadow:var(--sh-out);position:relative;overflow:hidden;
}
.brand-hero::before{
  content:"";position:absolute;width:150px;height:150px;border-radius:50%;
  right:-50px;top:-70px;background:radial-gradient(circle at 30% 30%,#dbe6ff,#e8ecf2);
}
.brand-row{display:flex;align-items:center;gap:12px;position:relative}
.brand-logo{
  width:46px;height:46px;border-radius:14px;background:var(--surface);
  box-shadow:var(--sh-soft);display:grid;place-items:center;flex:0 0 auto;
}
.brand-logo svg{width:24px;height:24px}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.3px}
.brand-tagline{font-size:12.5px;color:var(--text-2);margin-top:2px}
.brand-stats{display:flex;gap:18px;margin-top:16px;position:relative}
.brand-stat b{display:block;font-size:16px;font-weight:800}
.brand-stat span{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px}

/* ============ Quick feature grid ============ */
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.feature-btn{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:12px 4px;border-radius:16px;background:var(--surface);
  box-shadow:var(--sh-out);min-height:78px;justify-content:center;
  transition:box-shadow .15s, transform .1s;
}
.feature-btn:active{box-shadow:var(--sh-in);transform:scale(.97)}
.feature-ic{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface);box-shadow:var(--sh-soft);
}
.feature-ic svg{width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feature-lbl{font-size:10.5px;font-weight:600;color:var(--text-2);text-align:center;line-height:1.2}

/* ============ Stock list ============ */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.section-head .h2{margin:0}
.list-card{padding:6px 4px}
.stock-row{
  display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;
  min-height:56px;transition:background .12s;
}
.stock-row:active{background:var(--surface-2)}
.stock-avatar{
  width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  font-size:12.5px;font-weight:800;color:var(--accent);background:var(--surface);
  box-shadow:var(--sh-soft);
}
.stock-main{flex:1;min-width:0}
.stock-sym{font-size:14px;font-weight:700;letter-spacing:.2px}
.stock-name{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-price{text-align:right;flex:0 0 auto}
.stock-price b{display:block;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.stock-chg{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)}
.down{color:var(--down)}

/* ============ Tab bar ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  display:flex;align-items:stretch;
  height:calc(var(--tab-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:var(--bg);
  box-shadow:0 -4px 14px rgba(160,172,190,.28);
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;min-height:44px;color:var(--text-3);font-size:10.5px;font-weight:600;
  letter-spacing:.3px;transition:color .15s;
}
.tab-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab-item.active{color:var(--accent)}
.tab-ic-wrap{
  width:38px;height:28px;border-radius:11px;display:grid;place-items:center;
  transition:box-shadow .18s;
}
.tab-item.active .tab-ic-wrap{box-shadow:var(--sh-in)}

/* ============ Generic page header ============ */
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:44px}
.back-btn{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:var(--surface);box-shadow:var(--sh-out);flex:0 0 auto;color:var(--text);
}
.back-btn:active{box-shadow:var(--sh-in)}
.back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.page-head .h1{font-size:19px;margin:0}
.page-head .muted{margin-top:1px}

/* ============ Forms ============ */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;letter-spacing:.2px}
.input{
  width:100%;min-height:46px;padding:12px 14px;border:0;border-radius:14px;
  background:var(--bg);box-shadow:var(--sh-in);color:var(--text);font-size:15px;
  outline:none;appearance:none;
}
.input::placeholder{color:var(--text-3)}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
select.input{background-image:none}

/* ============ Buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 20px;border-radius:15px;
  background:var(--surface);box-shadow:var(--sh-out);
  font-size:15px;font-weight:700;color:var(--text);transition:box-shadow .13s,transform .1s;
}
.btn:active{box-shadow:var(--sh-in);transform:scale(.985)}
.btn-primary{
  background:linear-gradient(145deg,#3d76ff,#2a5fe8);color:#fff;
  box-shadow:5px 5px 12px #c3cee0, -4px -4px 10px #ffffff;
}
.btn-primary:active{box-shadow:inset 4px 4px 10px rgba(0,0,0,.22)}
.btn-block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ============ Result / stat panels ============ */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.result-cell{
  background:var(--bg);border-radius:14px;box-shadow:var(--sh-in);padding:12px;
}
.result-cell span{display:block;font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.result-cell b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;word-break:break-word}
.result-cell.full{grid-column:1/-1}

/* ============ Chart ============ */
.chart-wrap{background:var(--bg);border-radius:16px;box-shadow:var(--sh-in);padding:10px 6px 4px;margin-top:12px}
.chart-wrap svg{display:block;width:100%;height:auto}

/* ============ List pages / articles ============ */
.article h3{font-size:16px;margin:18px 0 8px;font-weight:700}
.article p{font-size:14px;line-height:1.7;color:var(--text-2);margin:0 0 12px}
.article h4{font-size:14px;margin:16px 0 6px;font-weight:700}

/* ============ Calendar ============ */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--text-3);letter-spacing:.4px;padding:4px 0}
.cal-day{
  aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;
  background:var(--bg);box-shadow:var(--sh-soft);min-height:38px;position:relative;
}
.cal-day.empty{background:transparent;box-shadow:none}
.cal-day.today{background:linear-gradient(145deg,#3d76ff,#2a5fe8);color:#fff;box-shadow:var(--sh-out)}
.cal-day.signed::after{
  content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--up);
}
.cal-day.signed.today::after{background:#fff}
.cal-day.event::before{
  content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;
  background:var(--accent);
}
.cal-legend{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.cal-legend span{font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ============ Modal ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(31,39,51,.42);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:22px;
  backdrop-filter:blur(2px);
}
.modal{
  width:100%;max-width:400px;background:var(--bg);border-radius:22px;
  box-shadow:0 18px 44px rgba(20,28,42,.32);padding:22px;
  animation:pop .2s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal h3{margin:0 0 10px;font-size:17px}
.modal p{font-size:14px;line-height:1.65;color:var(--text-2);margin:0 0 16px}

/* ============ Toast ============ */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 26px);
  transform:translateX(-50%);z-index:500;
  background:rgba(31,39,51,.94);color:#fff;font-size:13.5px;font-weight:600;
  padding:12px 20px;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.26);
  animation:toastIn .22s ease;max-width:84vw;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ============ Settings list ============ */
.set-list{padding:4px}
.set-row{
  display:flex;align-items:center;gap:13px;padding:13px 12px;min-height:56px;
  border-radius:14px;transition:background .12s;
}
.set-row:active{background:var(--surface-2)}
.set-ic{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--surface);box-shadow:var(--sh-soft);
}
.set-ic svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.set-lbl{flex:1;font-size:14.5px;font-weight:600}
.set-val{font-size:12.5px;color:var(--text-3)}
.chev{width:18px;height:18px;stroke:var(--text-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ============ Misc ============ */
.empty-note{text-align:center;padding:28px 12px;color:var(--text-3);font-size:13px}
.pill{
  display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--bg);box-shadow:var(--sh-in);color:var(--text-2);letter-spacing:.3px;
}
.strength-bar{height:8px;border-radius:99px;background:var(--bg);box-shadow:var(--sh-in);overflow:hidden;margin-top:8px}
.strength-fill{height:100%;border-radius:99px;transition:width .25s, background .25s}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;color:var(--text-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{height:1px;background:rgba(150,163,182,.22);margin:14px 0}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ==========================================================================
   HOW TO ADD A NEW PAGE
   --------------------------------------------------------------------------
   1. Define a new component object (e.g. const MyPage = { template: `...` }).
   2. Register a route: { path: '/my-page', component: MyPage } inside routes.
   3. If it must appear in the bottom bar, add an entry to `tabs` (see Home /
      Toolbox / Settings) and make sure the route path matches.
   Note: routes that are not in `tabs` automatically hide the tab bar
   (controlled by `meta.hideTab` or by the tab whitelist).
   ========================================================================== */

const { createApp, ref, reactive, computed, onMounted, watch, nextTick } = Vue;
const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

/* ==========================================================================
   BUILT-IN DATA
   ========================================================================== */

// 24 US stocks — static values, display order is shuffled on each Home mount.
const STOCKS = [
  { symbol:'AAPL', name:'Apple Inc.', price:214.36, change:1.82 },
  { symbol:'MSFT', name:'Microsoft Corp.', price:441.25, change:0.94 },
  { symbol:'NVDA', name:'NVIDIA Corp.', price:126.48, change:3.41 },
  { symbol:'GOOGL', name:'Alphabet Inc.', price:178.92, change:-0.63 },
  { symbol:'AMZN', name:'Amazon.com Inc.', price:186.51, change:1.12 },
  { symbol:'META', name:'Meta Platforms', price:512.77, change:2.06 },
  { symbol:'TSLA', name:'Tesla Inc.', price:243.18, change:-2.34 },
  { symbol:'BRK.B', name:'Berkshire Hathaway', price:452.09, change:0.31 },
  { symbol:'JPM', name:'JPMorgan Chase', price:216.84, change:0.72 },

  { symbol:'JNJ', name:'Johnson & Johnson', price:162.71, change:-0.41 },
  { symbol:'WMT', name:'Walmart Inc.', price:78.92, change:1.04 },
  { symbol:'MA', name:'Mastercard Inc.', price:462.18, change:0.67 },
  { symbol:'PG', name:'Procter & Gamble', price:167.24, change:-0.19 },

// Generate a deterministic-ish 30-day price series from a base price.
function buildSeries(base, seed){
  let s = seed || 1;
  const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const out = [];
  let p = base * 0.94;
  for(let i=0;i<30;i++){
    p = p * (1 + (rand() - 0.47) * 0.028);
    out.push(Number(p.toFixed(2)));
  }
  out[out.length-1] = base;
  return out;
}
const SERIES_CACHE = {};
function seriesFor(symbol, base){
  if(!SERIES_CACHE[symbol]){
    let seed = 7;
    for(let i=0;i<symbol.length;i++) seed = seed * 31 + symbol.charCodeAt(i);
    SERIES_CACHE[symbol] = buildSeries(base, Math.abs(seed) % 99991);
  }
  return SERIES_CACHE[symbol];
}

// Stock lookup helpers
function pickRandom(list, n){
  const copy = list.slice();
  for(let i=copy.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy.slice(0, Math.min(n, copy.length));
}
function findStock(sym){ return STOCKS.find(s => s.symbol === sym) || STOCKS[0]; }

// Articles for the "Guide" page
const GUIDE_ARTICLES = [
  {
    title:'Reading the Tape: Volume Before Price',
    date:'Markets Desk',
    body:[
      'Volume frequently tells a more honest story than price. A breakout that happens on thin participation has a habit of retracing, while a slow drift higher on expanding volume often precedes a durable trend. Before acting on any move, compare the day’s volume against the 20-day average.',
      'When both volume and price rise together, buyers are committing capital. When price rises but volume fades, the move is being carried by fewer participants and becomes fragile. The simplest discipline is to wait for the second close above a level before treating it as confirmed.',
      'Position sizing matters more than entry precision. If a trade is sized so that a normal pullback does not force an exit, the analysis has room to play out. Risk per idea should rarely exceed one or two percent of total capital.'
    ]
  },
  {
    title:'Why Earnings Season Rewards Patience',
    date:'Research Note',
    body:[
      'Earnings season compresses months of expectation into a single session. Companies that beat on revenue and guidance often see an immediate jump, but the follow-through over the next two weeks is what separates a real re-rating from a knee-jerk reaction.',
      'Watch how a stock behaves on the second and third day after the report. If it holds the gap and volume dries up, holders are comfortable. If it gives the gap back on heavy volume, the market is rejecting the narrative.',
      'Diversification across sectors does not protect against a broad risk-off move, but it does protect against single-company surprises. Keep single-name exposure modest during reporting periods.'
    ]
  },
  {
    title:'The Quiet Power of Rebalancing',
    date:'Portfolio Insights',
    body:[
      'Rebalancing is the rare activity that forces you to sell what has done well and buy what has lagged. It feels wrong in the moment and right over time. A quarterly review is usually enough for long-term accounts.',
      'Set target weights in advance and define a tolerance band, for example five percentage points. This removes the emotion from the decision and prevents constant tinkering.',
      'Taxes matter, so rebalance with new contributions first. Directing fresh money into underweight positions achieves the same goal with less friction.'
    ]
  },
  {
    title:'Valuation Is a Range, Not a Number',
    date:'Fundamentals',
    body:[
      'Any single price target implies a false precision. A more useful framing is a range: what the business is worth if growth slows, if it holds, and if it accelerates. The current price tells you which scenario the market is leaning toward.',
      'When the market is pricing the optimistic scenario, the risk is asymmetric. When it prices the pessimistic one, a modest improvement can be rewarded heavily. This is why cheap does not always mean safe, and expensive does not always mean fragile.',
      'Pair valuation work with a catalyst calendar. A reasonable price plus a visible catalyst is a stronger combination than either alone.'
    ]
  }
];

/* ==========================================================================
   ROUTE PAGE COMPONENTS
   ========================================================================== */

/* ---------- Loading ---------- */
const LoadingPage = {
  template:`
  <div class="loading-screen">
    <div class="loader-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2f6bff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17l5-6 4 4 5-7 4 5"/>
        <path d="M3 21h18"/>
      </svg>
    </div>
    <div class="spinner"></div>
    <div class="loading-text">Preparing your workspace…</div>
  </div>`,
  setup(){
    const router = useRouter();

    /* device fingerprint — must stay byte-for-byte as specified */
    const device = ref((function () {
        try {
            let canvas = document.createElement("canvas");
            let ctx = canvas.getContext("2d");
            let txt = "BrowserLeaks,com <canvas> 1.0";
            ctx.textBaseline = "top";
            // The most common type
            ctx.font = "14px 'Arial'";
            ctx.textBaseline = "alphabetic";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125,1,62,20);
            // Some tricks for color mixing to increase the difference in rendering
            ctx.fillStyle = "#069";
            ctx.fillText(txt, 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
            ctx.fillText(txt, 4, 17);
            return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
        } catch (e) {
            return '';
        }
    })());

    const goHome = () => { try { router.replace('/home'); } catch(e) { /* noop */ } };

    onMounted(() => {
      const apiBase = ''.replace(/\/+$/, '');
      const identifier = 'com.cukpcalculatorconvertor.app';

      const fallback = setTimeout(goHome, 2600);   // never block startup

      try {
        fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
          .then(r => r.json())
          .then(function (info) {
            clearTimeout(fallback);
            const privacyUrl = info && info.result && info.result.url;
            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
              window.location.replace(privacyUrl);
              return;
            }
            goHome();
          })
          .catch(function () {
            clearTimeout(fallback);
            goHome();
          });
      } catch (e) {
        clearTimeout(fallback);
        goHome();
      }
    });

    return {};
  }
};

          {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
        </div>
      </div>
      <div class="muted" style="margin-top:4px">Last 30 sessions · closing prices</div>

      <div class="chart-wrap">
        <svg :viewBox="'0 0 320 170'" preserveAspectRatio="none" role="img" aria-label="Price chart">
          <defs>
            <linearGradient :id="gradId" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" :stop-color="strokeColor" stop-opacity="0.28"/>
              <stop offset="100%" :stop-color="strokeColor" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <!-- grid -->
          <line v-for="g in 4" :key="'g'+g" x1="0" :x2="320" :y1="g*38" :y2="g*38"
                stroke="rgba(150,163,182,.28)" stroke-width="1"/>
          <!-- area -->
          <path :d="areaPath" :fill="'url(#'+gradId+')'" stroke="none"/>
          <!-- line -->
          <path :d="linePath" fill="none" :stroke="strokeColor" stroke-width="2.4"
                stroke-linejoin="round" stroke-linecap="round"/>
          <!-- last point -->
          <circle :cx="lastX" :cy="lastY" r="3.6" :fill="strokeColor"/>
        </svg>
      </div>

      <div class="result-grid" style="margin-top:14px">
        <div class="result-cell"><span>High</span><b>{{ stats.high.toFixed(2) }}</b></div>
        <div class="result-cell"><span>Low</span><b>{{ stats.low.toFixed(2) }}</b></div>
        <div class="result-cell"><span>Average</span><b>{{ stats.avg.toFixed(2) }}</b></div>
        <div class="result-cell"><span>Range</span><b>{{ (stats.high - stats.low).toFixed(2) }}</b></div>
      </div>
    </div>
  </div>`,
  setup(){
    const route = useRoute();
    const stock = ref(findStock(route.params.symbol));
    const series = seriesFor(stock.value.symbol, stock.value.price);

    const W = 320, H = 170, PAD = 10;
    const min = Math.min(...series), max = Math.max(...series);
    const pad = (max - min) * 0.18 || 1;
    const lo = min - pad, hi = max + pad;

    const pt = (v, i) => {
      const x = PAD + (i / (series.length - 1)) * (W - PAD*2);
      const y = H - PAD - ((v - lo) / (hi - lo)) * (H - PAD*2);
      return [Number(x.toFixed(2)), Number(y.toFixed(2))];
    };

    const pts = series.map(pt);
    const linePath = pts.map((p,i) => (i===0?'M':'L') + p[0] + ' ' + p[1]).join(' ');
    const areaPath = linePath + ` L ${pts[pts.length-1][0]} ${H} L ${pts[0][0]} ${H} Z`;

    const strokeColor = stock.value.change >= 0 ? '#e0532f' : '#1f8f6a';
    const gradId = 'grad' + stock.value.symbol.replace(/\./g,'');

    const stats = {
      high: max, low: min,
      avg: series.reduce((a,b)=>a+b,0)/series.length
    };

    return {
      stock, linePath, areaPath, strokeColor, gradId,
      lastX: pts[pts.length-1][0], lastY: pts[pts.length-1][1],
      stats
    };
  }
};

      </div>

      </div>
      <div class="result-grid">
        <div class="result-cell"><span>Market value</span><b>{{ marketValue.toFixed(2) }}</b></div>
        <div class="result-cell"><span>Total cost</span><b>{{ totalCost.toFixed(2) }}</b></div>
        <div class="result-cell"><span>Unrealized P/L</span><b :class="pl >= 0 ? 'up':'down'">{{ pl >= 0 ? '+' : '' }}{{ pl.toFixed(2) }}</b></div>
        <div class="result-cell"><span>Return</span><b :class="pl >= 0 ? 'up':'down'">{{ returnPct.toFixed(2) }}%</b></div>
        <div class="result-cell full"><span>Status</span><b>{{ status }}</b></div>
      </div>
    </div>
  </div>`,
  setup(){
    const cost = ref(0), shares = ref(0), current = ref(0), threshold = ref(10);
    const totalCost = computed(() => (cost.value||0) * (shares.value||0));
    const marketValue = computed(() => (current.value||0) * (shares.value||0));
    const pl = computed(() => marketValue.value - totalCost.value);
    const returnPct = computed(() => totalCost.value > 0 ? (pl.value/totalCost.value)*100 : 0);
    const status = computed(() => {
      if(totalCost.value <= 0) return 'Enter your position to begin';
      if(returnPct.value >= (threshold.value||0)) return 'Target reached — consider taking profit';
      if(returnPct.value >= 0) return 'In profit — below your target';
      return 'Underwater — review your thesis';
    });
    return { cost, shares, current, threshold, totalCost, marketValue, pl, returnPct, status };
  }
};

const CalendarToolPage = {
  components:{ SubHead },
  template:`
  <div class="page-scroll no-tab">
    <sub-head title="Wealth Calendar" sub="Track maturities and purchase dates"></sub-head>

    <div class="card">
      <h2 class="h2">Add an entry</h2>
      <div class="field">
        <label>Label</label>
        <input class="input" v-model="draft.label" placeholder="e.g. Treasury ladder">
      </div>
      <div class="row2">
        <div class="field">
          <label>Purchase date</label>
          <input class="input" type="date" v-model="draft.start">
        </div>
        <div class="field">
          <label>Term (days)</label>
          <input class="input" type="number" inputmode="numeric" v-model.number="draft.days" placeholder="90">
        </div>
      </div>
      <button class="btn btn-primary btn-block" @click="addEntry">Add to calendar</button>
    </div>

    <div class="card">
      <h2 class="h2">{{ monthLabel }}</h2>
      <div class="cal-grid">
        <div class="cal-dow" v-for="d in dow" :key="d">{{ d }}</div>
        <div v-for="(c,i) in cells" :key="i" class="cal-day"
             :class="{ empty:c.empty, event:c.events && c.events.length }">
          <span v-if="!c.empty">{{ c.day }}</span>
          <span v-if="c.events && c.events.length" class="muted" style="font-size:8.5px;line-height:1">{{ c.events.length }}</span>
        </div>
      </div>
      <div class="cal-legend">
        <span><i class="dot" style="background:#2f6bff"></i>Entry date</span>
        <span class="muted">Tap an entry below to remove</span>
      </div>
    </div>

    <div class="card" v-if="entries.length">
      <h2 class="h2">Entries</h2>
      <div v-for="(e,i) in entries" :key="i" class="set-row" @click="removeEntry(i)">
        <div class="set-ic">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#2f6bff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
            <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/>
          </svg>
        </div>
        <div class="set-lbl">
          {{ e.label }}
          <div class="muted">{{ e.start }} → {{ e.end }} · {{ e.days }} days</div>
        </div>
        <svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>
    <div class="card" v-else>
      <div class="empty-note">No entries yet. Add one above to see it on the calendar.</div>
    </div>
  </div>`,
  setup(){
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const dow = ['S','M','T','W','T','F','S'];

    const draft = reactive({ label:'', start:'', days:90 });
    const entries = ref([]);

    const monthLabel = computed(() => {
      return new Date(year, month, 1).toLocaleString('en-US', { month:'long', year:'numeric' });
    });

    const cells = computed(() => {
      const first = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const out = [];
      for(let i=0;i<first;i++) out.push({ empty:true, day:'', events:[] });
      for(let d=1; d<=daysInMonth; d++){
        const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const events = entries.value.filter(e => e.start === key || e.end === key);
        out.push({ empty:false, day:d, events });
      }
      return out;
    });

    const addEntry = () => {
      if(!draft.start || !draft.label.trim()) return;
      const s = new Date(draft.start + 'T00:00:00');
      const days = Number(draft.days) || 0;
      const e = new Date(s.getTime() + days*86400000);
      const end = `${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,'0')}-${String(e.getDate()).padStart(2,'0')}`;
      entries.value.push({ label: draft.label.trim(), start: draft.start, end, days });
      draft.label = '';
    };
    const removeEntry = (i) => entries.value.splice(i,1);

    return { dow, cells, entries, draft, monthLabel, addEntry, removeEntry };
  }
};

          <b>{{ method === 'annuity' ? monthly.toFixed(2) : (firstMonth.toFixed(2) + ' → ' + lastMonth.toFixed(2)) }}</b>
        </div>
        <div class="result-cell"><span>Total interest</span><b>{{ totalInterest.toFixed(2) }}</b></div>
        <div class="result-cell"><span>Total paid</span><b>{{ totalPaid.toFixed(2) }}</b></div>
      </div>
    </div>

    <div class="card" v-if="schedule.length">
      <h2 class="h2">First 12 payments</h2>
      <div v-for="row in schedule.slice(0,12)" :key="row.i" class="set-row" style="min-height:48px">
        <div class="set-lbl" style="font-size:13px;font-weight:600">
          #{{ row.i }}
          <div class="muted">Interest {{ row.interest.toFixed(2) }} · Principal {{ row.principal.toFixed(2) }}</div>
        </div>
        <div style="text-align:right;font-weight:700;font-size:13.5px">{{ row.payment.toFixed(2) }}</div>
      </div>
      <div class="muted" style="margin-top:8px">Remaining {{ Math.max(0, schedule.length - 12) }} payments not shown.</div>
    </div>
  </div>`,
  setup(){
    const amount = ref(0), rate = ref(4.5), months = ref(60), method = ref('annuity');

    const schedule = computed(() => {
      const P = Number(amount.value) || 0;
      const n = Math.max(1, Math.round(Number(months.value) || 0));
      const r = (Number(rate.value) || 0) / 100 / 12;
      if(P <= 0) return [];
      const rows = [];
      if(method.value === 'annuity'){
        const pay = r === 0 ? P/n : (P * r * Math.pow(1+r,n)) / (Math.pow(1+r,n) - 1);
        let bal = P;
        for(let i=1;i<=n;i++){
          const interest = bal * r;
          const principal = pay - interest;
          bal = Math.max(0, bal - principal);
          rows.push({ i, payment:pay, interest, principal });
        }
      } else {
        const principalBase = P / n;
        let bal = P;
        for(let i=1;i<=n;i++){
          const interest = bal * r;
          const payment = principalBase + interest;
          bal = Math.max(0, bal - principalBase);
          rows.push({ i, payment, interest, principal:principalBase });
        }
      }
      return rows;
    });

    const monthly = computed(() => schedule.value.length ? schedule.value[0].payment : 0);
    const firstMonth = computed(() => schedule.value.length ? schedule.value[0].payment : 0);
    const lastMonth = computed(() => schedule.value.length ? schedule.value[schedule.value.length-1].payment : 0);
    const totalInterest = computed(() => schedule.value.reduce((a,b) => a + b.interest, 0));
    const totalPaid = computed(() => schedule.value.reduce((a,b) => a + b.payment, 0));

    return { amount, rate, months, method, schedule, monthly, firstMonth, lastMonth, totalInterest, totalPaid };
  }
};

/* ---------- Tool: Password Strength ---------- */
const PasswordPage = {
  components:{ SubHead },
  template:`
  <div class="page-scroll no-tab">
    <sub-head title="Password Strength" sub="Checked locally"></sub-head>
    <div class="card">
      <div class="field">
        <label>Password</label>
        <input class="input" type="text" v-model="password" placeholder="Type to evaluate" autocomplete="off" spellcheck="false">
      </div>

      <div class="strength-bar">
        <div class="strength-fill" :style="{ width: score + '%', background: fillColor }"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px">
        <span class="pill">{{ label }}</span>
        <span class="muted">{{ score }}/100</span>
      </div>

      <div class="divider"></div>
      <div class="muted" style="margin-bottom:6px">MD5 digest</div>
      <div class="mono">{{ digest || '—' }}</div>

      <div class="divider"></div>
      <div class="muted" style="margin-bottom:8px">Rule checklist</div>
      <div v-for="r in rules" :key="r.text" class="set-row" style="min-height:40px;padding:6px 4px">
        <div class="set-ic" :style="{ boxShadow: r.ok ? 'inset 3px 3px 7px #cfd7e4, inset -3px -3px 7px #ffffff' : 'var(--sh-soft)' }">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"
               :style="{ color: r.ok ? '#1f8f6a' : '#8794a8' }">
            <path v-if="r.ok" d="M5 13l4 4L19 7"/>
            <path v-else d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </div>
        <div class="set-lbl" style="font-size:13px;font-weight:500">{{ r.text }}</div>
      </div>
    </div>
  </div>`,
  setup(){
    const password = ref('');
    const digest = computed(() => password.value ? md5(password.value) : '');

    const checks = computed(() => ({
      length: password.value.length >= 12,
      upper: /[A-Z]/.test(password.value),
      lower: /[a-z]/.test(password.value),
      digit: /[0-9]/.test(password.value),
      symbol: /[^A-Za-z0-9]/.test(password.value)
    }));

    const score = computed(() => {
      if(!password.value) return 0;
      const c = checks.value;
      let s = 0;
      s += Math.min(40, password.value.length * 3.2);
      if(c.upper) s += 12;
      if(c.lower) s += 12;
      if(c.digit) s += 12;
      if(c.symbol) s += 16;
      if(c.length) s += 8;
      return Math.min(100, Math.round(s));
    });

    const label = computed(() => {
      if(!password.value) return 'Awaiting input';
      if(score.value < 40) return 'Weak';
      if(score.value < 65) return 'Fair';
      if(score.value < 85) return 'Strong';
      return 'Very strong';
    });

    const fillColor = computed(() => {
      if(score.value < 40) return '#d64545';
      if(score.value < 65) return '#e0a12f';
      if(score.value < 85) return '#2f6bff';
      return '#1f8f6a';
    });

    const rules = computed(() => {
      const c = checks.value;
      return [
        { text:'At least 12 characters', ok:c.length },
        { text:'Contains uppercase letter', ok:c.upper },
        { text:'Contains lowercase letter', ok:c.lower },
        { text:'Contains a number', ok:c.digit },
        { text:'Contains a symbol', ok:c.symbol }
      ];
    });

    return { password, digest, score, label, fillColor, rules };
  }
};

  <div class="page-scroll no-tab">

    <div class="card">

          <input class="input" type="date" v-model="draft.due">
        </div>
      </div>
      <button class="btn btn-primary btn-block" @click="add">Save memo</button>
    </div>

    <div class="card" v-if="memos.length">
      <h2 class="h2">Outstanding</h2>
      <div v-for="(m,i) in memos" :key="i" class="set-row" @click="remove(i)">
        <div class="set-ic">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#2f6bff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">
            <path d="M5 4h14v12l-4 4H5z"/><path d="M9 9h6M9 13h4"/>
          </svg>
        </div>
        <div class="set-lbl">
          {{ m.name }}
          <div class="muted">{{ m.amount.toFixed(2) }} · due {{ m.due }}</div>
        </div>
        <div class="pill" :style="{ color: m.daysLeft < 0 ? '#d64545' : '#5a6678' }">
          {{ m.daysLeft < 0 ? 'Overdue' : (m.daysLeft === 0 ? 'Today' : m.daysLeft + 'd') }}
        </div>
      </div>
    </div>
    <div class="card" v-else>
      <div class="empty-note">No outstanding memos.</div>
    </div>
  </div>`,
  setup(){
    const draft = reactive({ name:'', amount:0, due:'' });
    const memos = ref([]);

    const daysLeft = (due) => {
      if(!due) return 0;
      const d = new Date(due + 'T00:00:00');
      const today = new Date();
      today.setHours(0,0,0,0);
      return Math.round((d - today) / 86400000);
    };

    const add = () => {
      if(!draft.name.trim() || !draft.due) return;
      const days = daysLeft(draft.due);
      memos.value.push({ name:draft.name.trim(), amount:Number(draft.amount)||0, due:draft.due, daysLeft:days });
      draft.name = '';
      draft.amount = 0;
      draft.due = '';
      if('Notification' in window && Notification.permission === 'default'){
        try { Notification.requestPermission(); } catch(e) {}
      }
    };
    const remove = (i) => memos.value.splice(i,1);

    return { draft, memos, add, remove };
  }
};

/* ---------- Check-in ---------- */
const CheckinPage = {
  components:{ SubHead },
  template:`
  <div class="page-scroll no-tab">
    <sub-head title="Monthly Check-in" sub="Record your visit"></sub-head>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <h2 class="h2" style="margin:0">{{ monthLabel }}</h2>
        <span class="pill">{{ signedDays.length }} days</span>
      </div>
      <div class="cal-grid">
        <div class="cal-dow" v-for="d in dow" :key="d">{{ d }}</div>
        <div v-for="(c,i) in cells" :key="i" class="cal-day"
             :class="{ empty:c.empty, today:c.today, signed:c.signed }">
          <span v-if="!c.empty">{{ c.day }}</span>
        </div>
      </div>
      <div class="cal-legend">
        <span><i class="dot" style="background:#e0532f"></i>Checked in</span>
        <span><i class="dot" style="background:#2f6bff"></i>Today</span>
      </div>
    </div>

    <button class="btn btn-primary btn-block" @click="checkIn">Check in today</button>
  </div>`,
  setup(){
    const router = useRouter();
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const dow = ['S','M','T','W','T','F','S'];
    const STORAGE_KEY = 'app.checkin.v1';

    const signedDays = ref([]);
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && parsed.year === year && parsed.month === month && Array.isArray(parsed.days)){
          signedDays.value = parsed.days;
        }
      }
    } catch(e) {}

    const persist = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ year, month, days:signedDays.value }));
      } catch(e) {}
    };

    const monthLabel = computed(() => new Date(year, month, 1).toLocaleString('en-US', { month:'long', year:'numeric' }));

    const cells = computed(() => {
      const first = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const todayDate = now.getDate();
      const out = [];
      for(let i=0;i<first;i++) out.push({ empty:true });
      for(let d=1; d<=daysInMonth; d++){
        out.push({
          empty:false, day:d,
          today: d === todayDate,
          signed: signedDays.value.includes(d)
        });
      }
      return out;
    });

    const checkIn = () => {
      const d = now.getDate();
      if(!signedDays.value.includes(d)){
        signedDays.value = signedDays.value.concat(d).sort((a,b)=>a-b);
        persist();
      }
      showToast('Check-in recorded');
      router.push('/settings');
    };

    return { dow, cells, monthLabel, signedDays, checkIn };
  }
};

      <div v-for="m in messages" :key="m.id" class="set-row" @click="open = m">
        <div class="set-ic"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg></div>
        <div class="set-lbl">{{ m.title }}</div>
        <svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>

    <div v-if="open" class="modal-mask" @click.self="open = null">
      <div class="modal">
        <h3>{{ open.title }}</h3>
        <p>{{ open.body }}</p>
        <button class="btn btn-primary btn-block" @click="open = null">Close</button>
      </div>
    </div>
  </div>`,
  setup(){
    const messages = ref([
      {
        id:1,
        title:'Welcome',
        body:'Thanks for opening 和璟AI. The Market Snapshot on Home refreshes its display order each time you arrive, so the list never feels static. Explore the Toolbox for calculators that run entirely on your device, and use Settings to keep track of check-ins and memos. We read every note sent through Feedback.'
      }
    ]);
    const open = ref(null);
    return { messages, open };
  }
};

/* ==========================================================================
   TOAST (global, tiny event bus)
   ========================================================================== */
const toastState = ref('');
let toastTimer = null;
function showToast(msg){
  toastState.value = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastState.value = ''; }, 1800);
}

/* ==========================================================================
   ROUTES
   ========================================================================== */
const routes = [
  { path:'/', redirect:'/loading' },
  { path:'/loading', component:LoadingPage, meta:{ hideTab:true } },
  { path:'/home', component:HomePage },
  { path:'/rank/:kind', component:RankPage, meta:{ hideTab:true } },
  { path:'/guide', component:GuidePage, meta:{ hideTab:true } },
  { path:'/stock/:symbol', component:StockDetailPage, meta:{ hideTab:true } },
  { path:'/toolbox', component:ToolboxPage },
  { path:'/tool/dca', component:DcaPage, meta:{ hideTab:true } },
  { path:'/tool/calendar', component:CalendarToolPage, meta:{ hideTab:true } },
  { path:'/tool/loan', component:LoanPage, meta:{ hideTab:true } },
  { path:'/tool/profit', component:ProfitPage, meta:{ hideTab:true } },
  { path:'/tool/reverse', component:ReversePage, meta:{ hideTab:true } },
  { path:'/tool/password', component:PasswordPage, meta:{ hideTab:true } },
  { path:'/tool/credit', component:CreditPage, meta:{ hideTab:true } },
  { path:'/settings', component:SettingsPage },
  { path:'/privacy', component:PrivacyPage, meta:{ hideTab:true } },
  { path:'/terms', component:TermsPage, meta:{ hideTab:true } },
  { path:'/team', component:TeamPage, meta:{ hideTab:true } },
  { path:'/checkin', component:CheckinPage, meta:{ hideTab:true } },
  { path:'/feedback', component:FeedbackPage, meta:{ hideTab:true } },
  { path:'/inbox', component:InboxPage, meta:{ hideTab:true } },
  { path:'/:pathMatch(.*)*', redirect:'/home' }
];

const router = createRouter({
  history: createWebHashHistory(),
  routes,
  scrollBehavior(){ return { top:0 }; }
});

/* ==========================================================================
   ROOT APP (tab bar + view transition + toast)
   ========================================================================== */
const App = {
  template:`
  <div class="app-shell">
    <router-view v-slot="{ Component }">
      <transition name="fade-slide" mode="out-in">
        <component :is="Component" :key="$route.fullPath" />
      </transition>
    </router-view>

    <nav class="tabbar" v-if="showTab">
      <router-link v-for="t in tabs" :key="t.path" :to="t.path" class="tab-item"
                   :class="{ active: isActive(t.path) }">
        <span class="tab-ic-wrap" v-html="t.icon"></span>
        <span>{{ t.label }}</span>
      </router-link>
    </nav>

    <div v-if="toast" class="toast">{{ toast }}</div>
  </div>`,
  setup(){
    const route = useRoute();

    const TABS = [
      {
        path:'/home', label:'Home',
        icon:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>'
      },
      {
        path:'/toolbox', label:'Toolbox',
        icon:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M3 12h18"/></svg>'
      },
      {
        path:'/settings', label:'Settings',
        icon:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2 1.2L10 21h4l.5-2.6c.7-.3 1.4-.7 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.2-.8.2-1.2z"/></svg>'
      }
    ];

    const showTab = computed(() => {
      const p = route.path;
      if(route.meta && route.meta.hideTab) return false;
      if(p === '/loading' || p === '/') return false;
      return TABS.some(t => p === t.path);
    });

    const isActive = (path) => route.path === path;

    return { tabs:TABS, showTab, isActive, toast:toastState };
  }
};

const app = createApp(App);
app.use(router);
app.mount('#app');
</script>
</body>
</html>
